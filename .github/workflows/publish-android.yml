name: 上传 Android 安装包

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-android.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a3b08b749451dae7873a6a642f7da95d8824165f
          persist-credentials: false
      - name: 校验并发布 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp download/question-diary-1.3.apk "$RUNNER_TEMP/question-diary.apk"
          printf '%s  %s\n' '18661f841792b331c82f75f1a1662c727ddeff96ad05d6f854e46a8051477ced' "$RUNNER_TEMP/question-diary.apk" | sha256sum --check
          gh release create android "$RUNNER_TEMP/question-diary.apk" \
            --target 'a3b08b749451dae7873a6a642f7da95d8824165f' \
            --title '「？」日记 Android' \
            --notes $'## 中文\n\n下载下方的 question-diary.apk，在 Android 设备上打开并安装。\n\n## English\n\nDownload question-diary.apk below and open it on your Android device. The app interface is in Chinese.'
